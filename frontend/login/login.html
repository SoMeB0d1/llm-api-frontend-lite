<!--
  login.html — 登录页面
  提供用户名/密码表单，用户登录成功后跳转到主页面 /index.html
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | LLM Lite</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <div class="login-toast" id="loginToast" role="status" aria-live="polite"></div>
    <main class="login-shell">
      <section class="login-card login-card--single">
        <form class="login-form" id="loginForm">
          <label class="field">
            <span>Username</span>
            <input
              id="loginUsername"
              type="text"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span>Password</span>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="primary-button" id="loginSubmit" type="submit">
            确认
          </button>
        </form>
        <div class="login-status" id="loginStatus">Ready</div>
      </section>
    </main>
    <script defer src="login.js"></script>
  </body>
</html>

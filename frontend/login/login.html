<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | LLM Lite</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <div class="bg-orbit"></div>
    <div class="login-toast" id="loginToast" role="status" aria-live="polite"></div>
    <main class="login-shell">
      <section class="login-card">
        <div class="brand">
          <img class="brand-logo" src="../resources/logo.png" alt="Logo" />
          <div class="brand-text">
            <div class="brand-title">LLM Lite</div>
            <div class="brand-subtitle">Frontend Desk</div>
          </div>
        </div>
        <h1 class="login-title">Sign in</h1>
        <p class="login-subtitle">
          Use your account to access chat history and models.
        </p>
        <form class="login-form" id="loginForm">
          <label class="field">
            <span>Username</span>
            <input
              id="loginUsername"
              type="text"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span>Password</span>
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="primary-button" id="loginSubmit" type="submit">
            Continue
          </button>
        </form>
        <div class="login-status" id="loginStatus">Ready</div>
      </section>
      <aside class="login-visual">
        <div class="login-pill">Secure access</div>
        <h2 class="login-visual-title">LLM Lite Workspace</h2>
        <p class="login-visual-subtitle">
          Sign in to keep tokens, history, and model choices in sync.
        </p>
        <div class="login-metrics">
          <div class="login-metric">
            <div class="login-metric-label">Mode</div>
            <div class="login-metric-value">Prompt + History</div>
          </div>
          <div class="login-metric">
            <div class="login-metric-label">Security</div>
            <div class="login-metric-value">Token Refresh</div>
          </div>
          <div class="login-metric">
            <div class="login-metric-label">Models</div>
            <div class="login-metric-value">Auto Sync</div>
          </div>
          <div class="login-metric">
            <div class="login-metric-label">Latency</div>
            <div class="login-metric-value">Fast Proxy</div>
          </div>
        </div>
      </aside>
    </main>
    <script defer src="login.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Lite Frontend</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="bg-orbit"></div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img class="brand-logo" src="resources/logo.png" alt="Logo" />
          <div class="brand-text">
            <div class="brand-title">LLM Lite</div>
            <div class="brand-subtitle">Frontend Desk</div>
          </div>
        </div>
        <div class="user-card">
          <div class="user-header">
            <div class="user-label">User</div>
            <button class="icon-button" id="hideSidebarBtn" type="button" aria-label="Hide sidebar">
              <img src="resources/hide.svg" alt="" />
            </button>
          </div>
          <div class="user-id" id="userId">guest</div>
          <button class="ghost-button" id="settingsBtn" type="button">
            设置
          </button>
        </div>
        <button class="primary-button" id="newChatBtn" type="button">
          创建新对话
        </button>
        <div class="history">
          <div class="history-title">History</div>
          <div class="history-list" id="historyList"></div>
        </div>
      </aside>
      <main class="chat" id="chatMain">
        <header class="chat-header">
          <button class="ghost-button menu-button" id="menuBtn" type="button">
            Menu
          </button>
          <div class="chat-title">Conversation</div>
          <div class="chat-tools">
            <select class="model-select" id="modelSelect" aria-label="Model">
              <option value="deepseek-v4-flash">deepseek-v4-flash</option>
            </select>
            <div class="status" id="statusText">Ready</div>
          </div>
        </header>
        <section class="chat-body">
          <div class="chat-history" id="chatHistory"></div>
          <form class="chat-input" id="chatForm">
            <textarea
              id="promptInput"
              placeholder="Ask something..."
              rows="2"
            ></textarea>
            <button class="send-button" id="sendBtn" type="submit" aria-label="Send">
              <img src="resources/send.svg" alt="" />
            </button>
          </form>
        </section>
      </main>
    </div>

    <div class="modal" id="settingsModal" hidden>
      <div class="modal-card modal-card--settings" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="settings-modal__header">
          <div class="settings-tabs" id="settingsTabs">
            <button
              class="settings-tab is-active"
              id="settingsTabModel"
              type="button"
              data-tab="model"
            >
              模型设置
            </button>
            <button
              class="settings-tab"
              id="settingsTabRoot"
              type="button"
              data-tab="root"
            >
              root设置
            </button>
          </div>
          <button
            class="settings-close"
            id="settingsCloseBtn"
            type="button"
            aria-label="关闭设置"
          >
            <img src="resources/cross.svg" alt="" />
          </button>
        </div>

        <div class="settings-modal__body">
          <section class="settings-panel is-active" id="settingsPanelModel" data-panel="model">
            <h2 class="modal-title" id="settingsModalTitle">模型设置</h2>
            <p class="modal-subtitle">配置当前会话的系统提示词</p>
            <div class="button-row">
              <label class="field">
                Prompt
                <textarea
                  id="systemPromptInput"
                  rows="4"
                  placeholder="You are an assistant. "
                >You are an assistant. </textarea>
              </label>
              <div class="prompt-save-wrap">
                <button class="ghost-button" type="button" id="savePromptBtn">保存 Prompt</button>
              </div>
              <div class="settings-logout-wrap">
                <button class="ghost-button" type="button" id="logoutBtn">退出登录</button>
              </div>
            </div>
          </section>

          <section class="settings-panel" id="settingsPanelRoot" data-panel="root">
            <h2 class="modal-title">root设置</h2>
            <p class="modal-subtitle">当前为 root 管理页（可按需扩展）。</p>
          </section>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"
    ></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>

<!--
  index.html — LLM Lite 聊天主页面
  提供完整的 AI 对话界面，包含侧边栏（用户信息、历史记录）、聊天区域、设置弹窗和确认弹窗。
  依赖外部库：marked（Markdown 渲染）、KaTeX（数学公式渲染）。
  入口 JS 模块：src/app.js

  用户端数据存储：
  所有用户状态（token、userId、userName、baseUrl、对话历史）均通过
  localStorage 持久化存储，键名统一以 "llm." 为前缀，由 src/constants.js
  中的 STORAGE_KEYS 集中管理。登录或 token 校验时写入，退出时清除。
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Lite Frontend</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css"
    />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <!-- 背景装饰 -->
    <div class="bg-orbit" aria-hidden="true"></div>
    <!-- 应用主体 -->
    <div class="app">
      <!-- 侧边栏 -->
      <aside class="sidebar" id="sidebar" aria-label="Sidebar">
        <header class="brand">
          <img class="brand-logo" src="resources/logo.png" alt="Logo" />
          <div class="brand-text">
            <div class="brand-title">LLM Lite</div>
            <div class="brand-subtitle">Frontend Desk</div>
          </div>
        </header>
        <section class="user-card" aria-label="User">
          <div class="user-header">
            <div class="user-label">User</div>
            <button class="icon-button" id="hideSidebarBtn" type="button" aria-label="Hide sidebar">
              <img src="resources/hide.svg" alt="" />
            </button>
          </div>
          <div class="user-id" id="userId">guest</div>
          <button class="ghost-button" id="settingsBtn" type="button">
            设置
          </button>
        </section>
        <button class="primary-button" id="newChatBtn" type="button">
          创建新对话
        </button>
        <nav class="history" aria-label="History">
          <div class="history-title">History</div>
          <div class="history-list" id="historyList"></div>
        </nav>
      </aside>
      <!-- 聊天主区域 -->
      <main class="chat" id="chatMain" aria-label="Conversation">
        <header class="chat-header">
          <button class="ghost-button menu-button" id="menuBtn" type="button">
            Menu
          </button>
          <div class="chat-title">Conversation</div>
          <div class="chat-tools">
            <select class="model-select" id="modelSelect" aria-label="Model">
              <option value="deepseek-v4-flash">deepseek-v4-flash</option>
            </select>
            <div class="status" id="statusText" role="status" aria-live="polite">Ready</div>
          </div>
        </header>
        <section class="chat-body">
          <div
            class="chat-history"
            id="chatHistory"
            role="log"
            aria-live="polite"
            aria-relevant="additions text"
          ></div>
          <form class="chat-input" id="chatForm">
            <textarea
              id="promptInput"
              placeholder="Ask something..."
              rows="2"
              aria-label="Prompt"
            ></textarea>
            <button class="send-button" id="sendBtn" type="submit" aria-label="Send">
              <img src="resources/send.svg" alt="" />
            </button>
          </form>
        </section>
      </main>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal" id="settingsModal" hidden>
      <div class="modal-card modal-card--settings" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="settings-modal__header">
          <div class="settings-tabs" id="settingsTabs">
            <button
              class="settings-tab is-active"
              id="settingsTabModel"
              type="button"
              data-tab="model"
            >
              模型设置
            </button>
            <button
              class="settings-tab"
              id="settingsTabRoot"
              type="button"
              data-tab="root"
            >
              root设置
            </button>
          </div>
          <button
            class="settings-close"
            id="settingsCloseBtn"
            type="button"
            aria-label="关闭设置"
          >
            <img src="resources/cross.svg" alt="" />
          </button>
        </div>

        <div class="settings-modal__body">
          <section class="settings-panel is-active" id="settingsPanelModel" data-panel="model">
            <h2 class="modal-title" id="settingsModalTitle">模型设置</h2>
            <p class="modal-subtitle">配置当前会话的系统提示词</p>
            <div class="button-row">
              <label class="field">
                Prompt
                <textarea
                  id="systemPromptInput"
                  rows="4"
                  placeholder="You are an assistant. "
                >You are an assistant. </textarea>
              </label>
              <div class="prompt-save-wrap">
                <button class="ghost-button" type="button" id="savePromptBtn">保存 Prompt</button>
              </div>
              <div class="settings-logout-wrap">
                <button class="ghost-button" type="button" id="logoutBtn">退出登录</button>
              </div>
            </div>
          </section>

          <section class="settings-panel" id="settingsPanelRoot" data-panel="root">
            <h2 class="modal-title">root设置</h2>
            <p class="modal-subtitle">当前为 root 管理页（可按需扩展）。</p>
          </section>
        </div>
      </div>
    </div>

    <!-- 回溯确认弹窗 -->
    <div class="modal" id="backModal" hidden>
      <div class="modal-card modal-card--confirm" role="dialog" aria-modal="true" aria-labelledby="backModalTitle">
        <h2 class="modal-title" id="backModalTitle">是否回溯至对话？</h2>
        <footer class="modal-actions">
          <button class="danger-button" id="backConfirmBtn" type="button">确认</button>
          <button class="ghost-button" id="backCancelBtn" type="button">取消</button>
        </footer>
      </div>
    </div>

    <!-- 重新生成确认弹窗 -->
    <div class="modal" id="regenerateModal" hidden>
      <div class="modal-card modal-card--confirm" role="dialog" aria-modal="true" aria-labelledby="regenerateModalTitle">
        <h2 class="modal-title" id="regenerateModalTitle">是否重新生成本消息？此后对话历史将舍弃！</h2>
        <footer class="modal-actions">
          <button class="danger-button" id="regenerateConfirmBtn" type="button">确认</button>
          <button class="ghost-button" id="regenerateCancelBtn" type="button">取消</button>
        </footer>
      </div>
    </div>

    <!-- 全局 toast 消息提示（顶部居中，1.8 秒自动消失，支持 error 红色 / success 绿色） -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <!-- 第三方库与应用入口 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"
    ></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>

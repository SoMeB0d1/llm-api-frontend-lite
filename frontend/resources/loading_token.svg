<svg width="64" height="64"
     viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <!-- 透明背景 -->
  <g fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round">

    <!-- 圆弧 -->
    <path d="
      M32 8
      A24 24 0 1 1 31.9 8
    "
    stroke-dasharray="90 150">

      <!-- 旋转动画 -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 32 32"
        to="360 32 32"
        dur="1s"
        repeatCount="indefinite"/>
    </path>

  </g>
</svg>